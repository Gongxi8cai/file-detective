name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile
        run: javac --release 21 -encoding UTF-8 -d out FileDetective.java test/FileDetectiveTest.java

      - name: Run tests
        run: java -cp out FileDetectiveTest
